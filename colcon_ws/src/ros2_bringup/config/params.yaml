tube0:
  ros_parameters:
    device: 'tube0' # same as the namespace 
    data_path: '/home/afrl/data/'  # path to save rosbags
    cam_topic: '/tube0/image_raw'           # sets topic gui displays & tag_node subscribes to 
    cam_info_topic: '/tube0/camera_info'
    enable_sonar: True                                    # sonar launch boolean
    sonar_speed: 1500 # m/s
    sonar_acoustics: True

    # # The following parameters are for flir camera
